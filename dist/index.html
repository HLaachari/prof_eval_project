<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f2" />
    <title>Classia — Suivi pédagogique</title>
    <link rel="icon" type="image/png" href="assets/classia-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <button class="brand" data-action="home" aria-label="Retour à l'accueil">
          <img src="assets/classia-logo-horizontal.png" alt="Classia" />
          <small>Espace professeur</small>
        </button>
        <nav class="main-nav" aria-label="Navigation principale">
          <button class="nav-item active" data-action="home"><span class="nav-icon nav-dashboard" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Vue d’ensemble</button>
          <p class="nav-label">MES CLASSES</p>
          <div id="class-nav"></div>
        </nav>
        <div class="sidebar-footer">
          <div class="profile-avatar">HL</div>
          <div><strong>Hossam Laachari</strong><small>Prof. d’informatique</small></div>
          <button class="icon-button" data-action="settings" aria-label="Paramètres">•••</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Ouvrir le menu">☰</button>
          <label class="global-search">
            <span>⌕</span>
            <input id="global-search" type="search" placeholder="Rechercher un élève ou une classe…" />
            <kbd>⌘ K</kbd>
          </label>
          <div class="topbar-actions">
            <span id="database-status" class="database-status syncing" title="État de la synchronisation PostgreSQL"><i></i><span>Connexion…</span></span>
            <span class="school-year">2026 / 2027</span>
            <button class="theme-toggle" data-action="toggle-theme" aria-label="Changer le thème" title="Mode clair ou sombre"><span class="sun-icon">☀</span><span class="moon-icon">☾</span><i></i></button>
            <button class="icon-button notification" data-action="notifications" aria-label="Notifications"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i id="notification-dot"></i></button>
          </div>
        </header>
        <div id="app" class="page"></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="seed-data.js"></script>
    <script src="app-v2.js"></script>
  </body>
</html>
